    schedule: [warm_stale_cache, rebuild_schema, denied_federation, promote_region_a, promote_region_b, rollback]
    requirements:
      - {id: artifact-identity, outcome: The SDK and service artifacts tested by CI are the exact immutable digests served in both production regions., probe: Independently compare build input digests and tested and served artifact bytes.}
      - {id: generation, outcome: Changing either the schema generator or lockfile changes the derived build identity; unchanged inputs remain reproducible., probe: Build declared input variants from an offline pinned toolchain.}
      - {id: identity, outcome: CI uses short-lived scoped federation; no wildcard production grants or stored workload keys are introduced., probe: Effective-permission checks and federation exchange audit with denied branch identities.}
      - {id: rollback, outcome: A rollback selects the previous tested digest consistently in both regions and preserves active customer journeys., probe: Promote and roll back under scheduled traffic; compare regional digests and customer results.}
    controls:
      - {id: rebuild-in-prod, fails: artifact-identity, shortcut: Rebuild a service during promotion.}
      - {id: schema-only-key, fails: generation, shortcut: Omit the generator version and lockfile from the cache key.}
      - {id: static-admin-key, fails: identity, shortcut: Use a permanent administrator credential in CI.}
      - {id: rollback-mutable-tag, fails: rollback, shortcut: Roll back using a tag that has changed since testing.}
    harness_failures: [staging-prod artifact confusion, trusting successful CLI exit without readback, broadening permissions to unblock a pipeline]
    evolution: A schema-only change after the first deployment must invalidate cached SDK artifacts without rebuilding unrelated components.

  - id: cache-index-extraction
    title: Refactor and optimize a correct shared cache without changing product behavior
    work: [refactor, optimization]
    architecture: coupled
    repair_scope: structural
    layers: [ui, api, sdk, cli, cache, database, delivery]
    interfaces: [browser-cli, http, cli, sc]
    languages: [python, typescript]
    domain: fitness bookings
    mechanism: Correct shared cache code scans the full collection for every lookup and owns adapter-specific serialization; a new worker topology requires independent caches and larger datasets.
    symptoms: Existing bookings are correct but new account sizes exceed the time budget; two independently configured cache instances cannot coexist.
    investigation: [cache ownership graph, allocation profiles, compatibility fixtures, query distributions, deployment topology]
    limits: {agent_seconds: 14400, cpus: 2, memory_mb: 4096, logical_p99_ms: 700, soak_seconds: 180, error_budget: 0.001, request_count: 2000}
    performance: {distributions: [uniform, skewed], sizes: [2000, 8000, 32000], min_speedup: 3.0, max_growth_ratio: 6.0, max_peak_rss_mb: 256, repetitions: 5, workload: exact booking lookup and updates with uniform and highly skewed keys}
    schedule: [two_instances_one_process, concurrent_updates, invalidate_after_write, cold_restart, rollback]
    requirements:
      - {id: parity, outcome: All prior allowed booking journeys and response contracts remain valid including duplicate-key and empty-cache behavior., probe: Differential golden replays across browser API SDK and CLI.}
      - {id: independent-state, outcome: Two independently configured cache instances never share entries credentials or invalidation state., probe: Concurrent instance operations with equal keys and different backing stores.}
      - {id: work-budget, outcome: Complete workloads meet the growth and memory budgets for both key distributions including writes and invalidations., probe: Operator-timed fresh-process workload runs with independent output checks.}
      - {id: freshness, outcome: Successful writes become visible on every declared adapter immediately; restart and rollback do not restore obsolete cached values., probe: Write then read through each adapter; restart and repeat with unseen keys.}
    controls:
      - {id: extract-scan-only, fails: work-budget, shortcut: Split the module while keeping collection scans.}
      - {id: optimize-global-only, fails: independent-state, shortcut: Add a fast index backed by global mutable state.}
      - {id: stale-fast-cache, fails: freshness, shortcut: Skip invalidation to make reads faster.}
      - {id: normalize-away-duplicates, fails: parity, shortcut: Change duplicate-key semantics while indexing.}
    harness_failures: [solving only one requested dimension, performance regression hidden behind refactor, missing invalidation across adapters]
    evolution: Add a second backing store to a third instance; previous parity freshness and workload constraints remain unchanged.
