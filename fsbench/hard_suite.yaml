      - {id: edit-generated-client, fails: client-contract, shortcut: Patch generated SDK files without changing the schema source.}
    harness_failures: [missing secondary interfaces, browser evidence loss, assuming submission authorization applies at execution, failing to regenerate artifacts]
    evolution: Add rejection-with-reason using the same approval policy and preserve the earlier approval cancellation and retry journeys.

  - id: build-provenance-cache
