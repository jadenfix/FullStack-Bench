    harness_failures: [ignoring invalid database artifacts, treating migration exit code as enforcement, destructive deduplication]
    evolution: Re-run the migration after a deliberately interrupted concurrent build while the old importer continues writing.
    novelty: {boundary: normalized-key-live-write-index-validity, failure_mode: collision-repair-races-with-constraint-build, invariant: uniqueness-with-reference-preserving-merge, closest_case: online-index-migration, distinction: This is enforcing a relational uniqueness invariant and preserving merged foreign references rather than migrating a retrieval index and permission state.}
