# New operator-only specifications; runtime worlds still require authoring and qualification.
schema_version: 1
status: design_only
cases:
  - id: multipart-upload-finalization
    batch: incident-workflows-v2
    title: Recover multipart document uploads without publishing partial files
    work: [bugfix, cloud]
    architecture: sound
    repair_scope: minimal
    layers: [ui, sdk, api, object-storage, database, worker, delivery]
    interfaces: [browser-cli, http, python-sdk, sc]
    languages: [python, typescript, sql]
    domain: B2B document processing
    mechanism: Part receipts identify a mutable object key rather than its upload generation; completion and lifecycle cleanup race, allowing an old upload to publish another generation's bytes.
    symptoms: A document shows Ready but downloading it yields mixed or incomplete pages; a cleanup job occasionally removes a newly completed upload.
    investigation: [upload generation metadata, per-part checksum manifests, lifecycle audit, browser upload timeline, object version receipts]
    limits: {agent_seconds: 14400, cpus: 2, memory_mb: 4096, logical_p99_ms: 1200, soak_seconds: 180, error_budget: 0.001, request_count: 2000}
    schedule: [retry_old_part, restart_upload_same_key, pause_completion, run_cleanup, lose_completion_reply, cold_restart]
    requirements:
      - {id: byte-integrity, outcome: A Ready document downloads exactly the committed ordered bytes and recorded checksum; incomplete uploads are not published., probe: Independently hash the complete downloaded object after interleaving parts from two generations.}
      - {id: generations, outcome: Part and completion requests from an expired upload cannot alter or publish its replacement; completion retries return the same document version., probe: Capture old part URLs and receipts then use them after a replacement upload has started.}
      - {id: cleanup, outcome: Cleanup removes only expired uncommitted generation data; committed documents and active uploads retain their bytes and quota accounting., probe: Run cleanup at observed completion barriers and reconcile objects with rows and quota totals.}
      - {id: product-state, outcome: The page distinguishes uploading processing failed and Ready; reload and reconnect resume the correct upload without duplicate document rows., probe: Pinned browser upload with interrupted connection then SDK completion and page reload.}
    controls:
      - {id: trust-part-number, fails: generations, shortcut: Associate receipts by object key and part number only.}
      - {id: ready-before-object, fails: byte-integrity, shortcut: Mark the row Ready before verifying final object bytes.}
      - {id: cleanup-key-prefix, fails: cleanup, shortcut: Delete expired object-key prefixes without generation checks.}
      - {id: new-row-on-reload, fails: product-state, shortcut: Start a fresh document row on every reconnect.}
    harness_failures: [trusting successful object API status, incomplete durable readback, unsafe cleanup of similarly named resources]
    evolution: Replace a failed upload at the same document path while the old cleanup task is already queued.
    novelty: {boundary: upload-generation-object-publication, failure_mode: stale-part-receipt-aba, invariant: published-bytes-match-generation, closest_case: mcp-cli-stream-resume, distinction: This repairs generation identity and object publication against lifecycle cleanup rather than stream transport or cancellation routing.}
    realism:
      trigger: A mobile client starts resuming uploads after an SDK release while the nightly expired-upload cleanup is active.
      baseline: Single-generation uploads pass existing checks; overlapping replacements expose the failure.
      impact: Operations users open a document whose Ready state does not match its downloadable contents.
      scale: 40 concurrent uploads; 16 parts per file; deterministic small objects exercise the same lifecycle as production files.
      change_window: Keep ordinary downloads available throughout; complete repair before the next explicitly scheduled cleanup run.
      mitigation: Pause expired-upload cleanup for one declared cycle while retaining its backlog and serving committed documents.
      protected: [committed object versions, active upload receipts, existing document IDs, quota ledger]
      capability_needs: [versioned multipart object-store fixture, lifecycle barriers, pinned browser client]
      sources: [{title: HTTP conditional request semantics, url: 'https://www.rfc-editor.org/rfc/rfc9110.html'}]

  - id: snapshot-cdc-handoff
    batch: incident-workflows-v2
    title: Repair the handoff from a database snapshot to a live change feed
    work: [refactor, bugfix, cloud]
    architecture: coupled
    repair_scope: structural
    layers: [database, replication, worker, api, sdk, observability, delivery]
    interfaces: [http, cli, python-sdk, sc]
    languages: [python, sql]
    domain: warehouse operations
    mechanism: Snapshot rows use a wall-clock cutoff while the change reader acknowledges row offsets rather than complete transaction positions; a crash between rows loses part of a committed transaction.
    symptoms: Newly connected warehouses initially reconcile but later show missing deletes and impossible combinations of shipment and inventory state.
    investigation: [exported snapshot identity, replication slot positions, transaction boundary traces, sink checkpoints, source-sink reconciliation]
    limits: {agent_seconds: 14400, cpus: 2, memory_mb: 4096, logical_p99_ms: 900, soak_seconds: 180, error_budget: 0.001, request_count: 2000}
    schedule: [write_during_snapshot, multirow_transaction, crash_mid_transaction, replay_slot_after_restart, delete_before_handoff, slow_sink]
    requirements:
      - {id: handoff, outcome: The sink represents the snapshot plus every committed subsequent change through the declared catch-up position without a gap or duplicate effect., probe: Compare independent source and sink snapshots at an observed transaction barrier.}
      - {id: atomic-visibility, outcome: Readers do not see half of a source transaction and aborted transactions never appear., probe: Pause application halfway through a multirow transaction then issue real sink API reads.}
      - {id: recovery, outcome: Restart after a rejected sink write or interrupted transaction replays safely; a checkpoint never acknowledges an unapplied transaction., probe: Interrupt at sink-commit and checkpoint barriers then restart the reader from its stored position.}
      - {id: retention, outcome: Catch-up converges within 30 seconds after the bounded sink stall; replication retention remains under the stated fixture byte ceiling and no source rows are deleted to recover., probe: Observe slot retention bytes and transaction lag during stall and catch-up with continuing source writes.}
    controls:
      - {id: timestamp-handoff, fails: handoff, shortcut: Use the last snapshot row timestamp as the feed start.}
      - {id: acknowledge-each-row, fails: atomic-visibility, shortcut: Publish and checkpoint source transactions one row at a time.}
      - {id: checkpoint-before-write, fails: recovery, shortcut: Advance the replication position before committing sink state.}
      - {id: discard-slot-backlog, fails: handoff, shortcut: Recreate a lagged slot at the current position.}
    harness_failures: [confusing process health with convergence, ignoring transaction boundaries, losing checkpoint evidence after restart]
    evolution: A transaction deletes one row and recreates its natural key while the snapshot reader is paused.
    novelty: {boundary: exported-snapshot-wal-transaction, failure_mode: row-checkpoint-crosses-uncommitted-sink, invariant: gapless-atomic-change-feed, closest_case: online-index-migration, distinction: This is a transactional snapshot-to-WAL handoff with replication retention rather than search index generations and permission epochs.}
    realism:
      trigger: A customer enables continuous warehouse synchronization during a busy receiving shift.
      baseline: Initial snapshots and ordinary single-row transactions pass; concurrent handoff and multirow replay fail.
      impact: Dispatch sees inventory and shipment records that cannot have existed together in the source database.
      scale: 10000 seeded rows; 20 source transactions per second; up to eight changed rows per transaction; a ten-second sink stall; 64 MiB retention ceiling.
      change_window: Maintain source writes throughout; catch up within 30 seconds after the declared sink stall ends.
      mitigation: Keep dispatch on the last consistent source view while the new sink catches up; do not drop the replication slot.
      protected: [source rows, transaction boundaries, replication position, customer-visible snapshot contract]
      capability_needs: [real pinned PostgreSQL logical replication, exported snapshots, operator slot metrics]
      sources: [{title: PostgreSQL 17 logical decoding concepts, url: 'https://www.postgresql.org/docs/17/logicaldecoding-explanation.html'}]

  - id: cancellation-pool-exhaustion
    batch: incident-workflows-v2
    title: Stop a cancellation-driven database connection leak in a live API
    work: [bugfix]
    architecture: sound
    repair_scope: minimal
    layers: [sdk, api, async-runtime, database, load-balancer, observability]
    interfaces: [http, cli, python-sdk, sc]
    languages: [python, sql]
    domain: customer support reporting
    mechanism: A lazily consumed result iterator owns a pooled connection; request timeout cancels its producer but bypasses cleanup and leaves the transaction and pool permit held.
    symptoms: Health checks stay green while support pages time out; restarting briefly helps; database activity accumulates idle transactions after cancelled reports.
    investigation: [pool acquisition traces, task cancellation logs, idle transaction age, lazy iterator ownership, request deadline propagation]
    limits: {agent_seconds: 10800, cpus: 2, memory_mb: 4096, logical_p99_ms: 800, soak_seconds: 180, error_budget: 0.001, request_count: 2000}
    schedule: [cancel_before_acquire, cancel_during_query, cancel_mid_iteration, downstream_disconnect, query_exception, uncancelled_foreground_request]
    requirements:
      - {id: release, outcome: Completion exception and cancellation return all request-owned database permits and end transactions; the pool returns to its declared baseline after each bounded drain., probe: Observe operator pool and database state after controlled cancellations at every ownership boundary.}
      - {id: deadline, outcome: The original logical deadline covers acquisition query and iteration; timeout is surfaced correctly without suppressing caller cancellation., probe: Timestamp each stage and cancel the SDK caller before and after acquisition.}
      - {id: isolation, outcome: Cancelling a report neither cancels independent customer requests nor closes another task's connection., probe: Hold two queries at separate barriers; cancel one and complete the other.}
      - {id: availability, outcome: Normal customer requests keep meeting the published SLO under the repeated cancellation workload with the existing pool size., probe: Open-loop foreground traffic while 25 percent of report requests cancel mid-iteration.}
    controls:
      - {id: bigger-pool, fails: release, shortcut: Increase connection limits without repairing ownership.}
      - {id: swallow-cancel, fails: deadline, shortcut: Catch cancellation and wait for the report to finish.}
      - {id: close-shared-pool, fails: isolation, shortcut: Close the entire pool when any iterator is abandoned.}
      - {id: cleanup-success-only, fails: release, shortcut: Return the permit only after complete iteration.}
    harness_failures: [restarting instead of proving cleanup, mistaking liveness for service health, failing to inspect cancellation paths]
    evolution: A client abandons an async iterator without requesting its next row; the connection still returns during bounded cleanup.
    novelty: {boundary: lazy-iterator-transaction-ownership, failure_mode: cancellation-skips-resource-release, invariant: bounded-permit-and-transaction-lifetime, closest_case: mcp-cli-stream-resume, distinction: This is ownership cleanup for pooled transactions and lazy iterators rather than stream session identifiers and export recovery.}
    realism:
      trigger: A shorter mobile report timeout launches during a support traffic peak.
      baseline: Fully consumed reports pass; abandoned iterators and timeout paths retain connections.
      impact: Support agents cannot open unrelated customer pages after a few cancelled reports.
      scale: Pool maximum eight connections; 20 foreground requests per second; four reporting clients with controlled cancellation.
      change_window: Maintain foreground traffic during diagnosis; cancellation cleanup finishes within two seconds after the query barrier is released.
      mitigation: Temporarily cap concurrent reports at two while preserving customer requests and cancelled-request evidence.
      protected: [pool maximum, caller cancellation contract, transaction semantics, foreground endpoints]
      capability_needs: [real async database pool, controlled query barriers, operator task and connection metrics]
      sources: [{title: Python 3.12 coroutine cancellation, url: 'https://docs.python.org/3.12/library/asyncio-task.html'}]

  - id: restore-erasure-tombstones
    batch: incident-workflows-v2
    title: Make a recovery restore honor completed customer erasures
    work: [feature, cloud, refactor]
    architecture: coupled
    repair_scope: structural
    layers: [ui, api, database, backup, object-storage, queue, identity]
    interfaces: [browser-cli, http, cli, sc]
    languages: [python, typescript, sql]
    domain: customer support SaaS
    mechanism: The existing live erasure path works but recovery restores an older database and object manifest without applying later erasure decisions before serving or resuming queued work.
    symptoms: Recovery drills restore a consistent backup but old deleted attachments and queued customer exports become accessible again.
    investigation: [backup watermark, durable erasure decision log, attachment versions, delayed export payloads, restore admission state]
    limits: {agent_seconds: 14400, cpus: 2, memory_mb: 4096, logical_p99_ms: 900, soak_seconds: 180, error_budget: 0.001, request_count: 2000}
    schedule: [backup_before_erasure, erase_customer, enqueue_delayed_export, isolated_restore, resume_workers, rotate_identity]
    requirements:
      - {id: no-resurrection, outcome: A completed erasure remains effective on every API export attachment link and queued job after restoring an older backup., probe: Erase after backup then restore privately and probe all product entry points before and after admission.}
      - {id: retained-data, outcome: Restore preserves non-erased customers and the explicitly declared minimal audit records; broad deletion is not a valid recovery., probe: Independently compare surviving customer rows and permitted audit fields with source manifests.}
      - {id: admission, outcome: A restored runtime serves no customer reads and executes no jobs until it has applied erasure decisions through the declared recovery watermark., probe: Pause erasure replay and attempt real reads and jobs while the restore readiness endpoint is observed.}
      - {id: replay, outcome: Erasure replay and restore are repeatable; interruption creates neither newly exposed data nor duplicate audit effects., probe: Interrupt replay between row and object changes then restart and repeat the complete restore.}
    controls:
      - {id: filter-ui-only, fails: no-resurrection, shortcut: Hide deleted customers in the page while restoring exports and links.}
      - {id: admit-before-replay, fails: admission, shortcut: Expose the restored service before reconciling erasures.}
      - {id: delete-all-restored-data, fails: retained-data, shortcut: Wipe the restored customer store to prevent resurrection.}
      - {id: tombstones-in-old-backup, fails: no-resurrection, shortcut: Trust only tombstones that existed when the backup was made.}
    harness_failures: [final-state-only verification, missing delayed jobs, declaring a consistent backup semantically safe]
    evolution: Erase another customer while an isolated restore is replaying decisions; the admission watermark must include the declared second decision.
    novelty: {boundary: backup-recovery-erasure-admission, failure_mode: old-snapshot-resurrects-deleted-data, invariant: erased-data-unservable-after-restore, closest_case: online-index-migration, distinction: This adds a restore-admission product capability for database objects and delayed jobs rather than fixing an existing online index cutover.}
    realism:
      trigger: A recovery rehearsal exposes deleted customer attachments after a database restore.
      baseline: Live erasure succeeds and ordinary restores preserve consistency; the new erasure-aware recovery contract is absent.
      impact: Previously erased customer data can be downloaded during a recovery drill.
      scale: 100 customers; 2000 attachments; 20 erasures after backup; two delayed exports per erased customer.
      change_window: Keep production live; build and validate the isolated restored environment before admitting it to customer traffic.
      mitigation: Keep the restored environment fenced from customer reads and paused workers until recovery policy is implemented.
      protected: [non-erased customer data, declared audit fields, erasure decision IDs, production resources]
      capability_needs: [isolated restore environment, versioned backup and object manifests, externally retained erasure log]
      sources: [{title: SQLite online backup API, url: 'https://www.sqlite.org/backup.html'}]

  - id: recurring-schedule-exceptions
    batch: incident-workflows-v2
    title: Repair recurring appointments across daylight-saving changes and exceptions
    work: [bugfix, refactor]
    architecture: coupled
    repair_scope: structural
    layers: [ui, sdk, api, calendar-engine, database, worker, delivery]
    interfaces: [browser-cli, http, cli, python-sdk]
    languages: [python, typescript, sql]
    domain: field service scheduling
    mechanism: The recurring series is stored as repeated UTC offsets while exception records are keyed by the occurrence's current rendered start; timezone transitions and edits detach exceptions from their original occurrence identity.
    symptoms: A recurring local appointment moves an hour; an edited exception appears twice; reminder jobs target an occurrence that the page says was cancelled.
    investigation: [pinned timezone data, series and exception rows, occurrence identity contract, reminder payloads, browser local-time rendering]
    limits: {agent_seconds: 14400, cpus: 2, memory_mb: 4096, logical_p99_ms: 900, soak_seconds: 180, error_budget: 0.001, request_count: 2000}
    schedule: [spring_transition, fall_transition, edit_single_occurrence, edit_future_series, cancel_exception, replay_reminder, cold_restart]
    requirements:
      - {id: local-time, outcome: Supported recurrence rules retain the declared local wall time and timezone; ambiguous and nonexistent times follow the explicit product policy and pinned timezone version., probe: Independently expand a bounded declared recurrence subset across both timezone transitions and compare API and browser results.}
      - {id: exception-identity, outcome: Moving one occurrence preserves its original occurrence identity; series edits do not duplicate or forget existing cancellations and moved exceptions., probe: Apply single-occurrence and future-series changes then enumerate all occurrences through SDK and API.}
      - {id: reminders, outcome: Each eligible occurrence has one effective reminder and cancelled occurrences send none; previously queued stale reminders cannot notify the wrong appointment., probe: Deliver queued reminder versions after editing and inspect the independent notification sink.}
      - {id: compatibility, outcome: Existing single appointments and pinned old SDK responses remain compatible; keyboard date editing and page reload display the persisted local appointment., probe: Real browser editing and frozen client replays after server restart.}
    controls:
      - {id: add-seven-utc-days, fails: local-time, shortcut: Expand recurring local appointments with a fixed UTC duration.}
      - {id: key-by-new-start, fails: exception-identity, shortcut: Identify exceptions by their newly moved timestamp.}
      - {id: trust-queued-reminder, fails: reminders, shortcut: Send reminders from a submission-time schedule snapshot.}
      - {id: rewrite-every-occurrence, fails: exception-identity, shortcut: Regenerate the series and discard the exception table.}
    harness_failures: [testing a single timezone, replacing business recurrence semantics with timestamp arithmetic, missing asynchronous reminders]
    evolution: Change only future occurrences of a series whose earlier occurrence has already been moved and whose next occurrence was cancelled.
    novelty: {boundary: recurrence-identity-exception-reminder, failure_mode: rendered-start-replaces-original-identity, invariant: stable-occurrence-and-wall-time, closest_case: approval-product-evolution, distinction: This is recurrence expansion and exception identity through timezone transitions rather than role-checked workflow transitions.}
    realism:
      trigger: The scheduler receives the first daylight-saving transition after adding Edit this and future appointments.
      baseline: UTC-only series and individual appointments pass existing checks; timezone transitions with edited exceptions fail.
      impact: Technicians arrive at the wrong local time or receive reminders for cancelled visits.
      scale: 200 series across four named timezones; weekly and monthly rules from an explicitly supported subset; a 90-day horizon.
      change_window: Keep single-appointment booking available; repair before the next bounded reminder batch is released.
      mitigation: Hold reminders only for affected recurring series and keep their queued records for replay after repair.
      protected: [past completed appointments, occurrence identity, single-appointment contracts, pinned timezone bundle]
      capability_needs: [pinned timezone database, independent recurrence fixture, browser timezone controls, notification sink]
      sources: [{title: RFC 5545 recurrence and date-time semantics, url: 'https://www.rfc-editor.org/rfc/rfc5545'}]

  - id: infrastructure-state-adoption
    batch: incident-workflows-v2
    title: Adopt existing cloud resources into declarative infrastructure without replacement
    work: [cloud, refactor]
    architecture: coupled
    repair_scope: structural
    layers: [infrastructure, provider, database, identity, api, delivery]
    interfaces: [tofu-cli, http, sc]
    languages: [python, hcl]
    domain: B2B reporting platform
    mechanism: A functioning hand-managed production stack has resource IDs and dependent grants outside declaration state; moving to reusable modules makes the first plan propose replacements with similar logical names.
    symptoms: The new module plan appears tidy but would recreate the production database and detach grants from active service identities.
    investigation: [provider resource IDs, declaration state serials, dependency graph, effective grants, replacement reasons]
    limits: {agent_seconds: 14400, cpus: 2, memory_mb: 4096, logical_p99_ms: 900, soak_seconds: 180, error_budget: 0.001, request_count: 2000}
    schedule: [import_existing_resources, module_address_move, concurrent_state_change, interrupted_apply, drift_readback, repeated_plan]
    requirements:
      - {id: identity-preservation, outcome: Existing protected database object and workload identities keep their provider IDs and data throughout adoption; no replacement window is available., probe: Compare operator resource identity and data snapshots before after and during apply.}
      - {id: state-safety, outcome: State updates reject a stale serial and remain recoverable after interrupted apply; repeat plans converge without destructive actions., probe: Hold two competing state updates then interrupt and resume the permitted plan.}
      - {id: reproducibility, outcome: The same declared modules create a fresh equivalent stack while the production adoption preserves pre-existing identities., probe: Rebuild in a fresh project and compare observable contracts and exact grants separately from provider IDs.}
      - {id: bounded-drift, outcome: Declared adoption reconciles the explicitly listed allowed drift and reports protected incompatible drift without deleting resources or broadening privileges., probe: Inject one safe configuration drift and one protected replacement-requiring change then inspect the plan and live state.}
    controls:
      - {id: recreate-for-clean-state, fails: identity-preservation, shortcut: Destroy and recreate resources under the new module addresses.}
      - {id: overwrite-state, fails: state-safety, shortcut: Force-push a stale state snapshot.}
      - {id: ignore-all-changes, fails: bounded-drift, shortcut: Silence the plan by ignoring every resource change.}
      - {id: manual-adoption-only, fails: reproducibility, shortcut: Import production but omit fresh-create module behavior.}
    harness_failures: [trusting plan summaries without replacement details, losing state-lock context, confusing fresh creation with production adoption]
    evolution: Rename a second module after adoption while retaining the same protected provider resource IDs.
    novelty: {boundary: declaration-state-provider-resource-id, failure_mode: address-change-causes-replacement, invariant: adopt-without-recreating-existing-state, closest_case: tenant-preview-infrastructure, distinction: This preserves existing production resource identities during state import and address migration rather than creating and deleting new previews.}
    realism:
      trigger: An operations team introduces reusable infrastructure modules around a live stack created before infrastructure state existed.
      baseline: Production serves correctly; the requested ownership migration must not replace durable resources.
      impact: A naive apply destroys data or removes workload access even though the module code compiles.
      scale: 30 resources with dependent grants and service bindings; two operators; a small real seeded customer dataset.
      change_window: No maintenance window; adopt declared ownership while existing customer sessions keep serving.
      mitigation: Save an operator-verifiable state snapshot and restrict apply to a reviewed bounded adoption plan.
      protected: [provider resource IDs, durable database and object data, existing effective grants, state serial and lineage]
      capability_needs: [real pinned OpenTofu provider for SimCloud, import and state-move support, state locking]
      sources: [{title: OpenTofu state move command, url: 'https://opentofu.org/docs/cli/commands/state/mv/'}]

  - id: native-sdk-buffer-lifetime
    batch: incident-workflows-v2
    title: Repair a native SDK buffer lifetime across asynchronous callbacks
    work: [bugfix, refactor]
    architecture: coupled
    repair_scope: structural
    layers: [native-library, ffi, sdk, cli, api, worker, delivery]
    interfaces: [native-cli, python-sdk, http, sc]
    languages: [c, python]
    domain: document processing
    mechanism: A language wrapper lends a temporary buffer to a native asynchronous callback; cancellation releases the owner before the native completion path finishes, and callback registration races with shutdown.
    symptoms: Small synchronous requests pass but large documents occasionally corrupt output or crash a worker when the user cancels processing.
    investigation: [FFI ownership contract, sanitizer traces, callback registration order, native handle counts, SDK cancellation timeline]
    limits: {agent_seconds: 14400, cpus: 2, memory_mb: 4096, logical_p99_ms: 1200, soak_seconds: 180, error_budget: 0.001, request_count: 2000}
    schedule: [delayed_callback, gc_owner_before_callback, cancel_inflight, callback_after_shutdown, callback_error, repeated_init_shutdown]
    requirements:
      - {id: ownership, outcome: Native work never accesses a freed or mutated input buffer; the result corresponds to the submitted immutable bytes even if the wrapper owner is collected., probe: Pinned ASan and UBSan runs with controlled native callback delay and garbage collection before completion.}
      - {id: shutdown, outcome: Cancellation and shutdown drain or invalidate only their owned callbacks; no completion callback accesses a destroyed SDK context., probe: Pause callbacks then cancel and destroy one of two independent contexts before releasing the barrier.}
      - {id: resource-lifetime, outcome: Repeated initialization cancellation and callback failure return native handles and memory to the declared baseline within the bounded cleanup period., probe: Operator handle and cgroup memory observations across 100 lifecycle iterations.}
      - {id: application, outcome: Complete processing results remain compatible through the CLI SDK and serving API and survive worker restart as durable product records., probe: Independent full-document checksums through each real interface followed by cold restart.}
    controls:
      - {id: raw-temporary-pointer, fails: ownership, shortcut: Pass a pointer without retaining its owner.}
      - {id: leak-every-buffer, fails: resource-lifetime, shortcut: Retain all borrowed buffers forever.}
      - {id: unregister-without-drain, fails: shutdown, shortcut: Remove callback registration while callbacks are executing.}
      - {id: disable-native-path, fails: application, shortcut: Return placeholder results instead of exercising the required native engine.}
    harness_failures: [not inspecting the FFI contract, masking use-after-free with sleeps, ignoring lifecycle leak measurements]
    evolution: Cancel one SDK context while another runs the same native engine and completes normally.
    novelty: {boundary: ffi-buffer-owner-native-callback, failure_mode: callback-outlives-borrowed-storage, invariant: ownership-through-cancellation-and-shutdown, closest_case: binary-ingest-framing, distinction: This is asynchronous cross-language memory ownership rather than packet framing byte order or decoder complexity.}
    realism:
      trigger: A Python SDK release switches a native engine call from synchronous to asynchronous for larger documents.
      baseline: Native synchronous paths are correct; delayed callbacks expose wrapper ownership errors.
      impact: Customers receive corrupted processing results or a worker crash during cancellation.
      scale: Four concurrent SDK contexts; input sizes from one KiB to four MiB; 100 repeated lifecycle runs.
      change_window: Preserve API availability; local sanitizer repro uses controlled barriers rather than waiting for a random crash.
      mitigation: Temporarily limit native concurrent processing while retaining requests and the existing result contract.
      protected: [native ABI, submitted input bytes, allowed result semantics, per-context cancellation]
      capability_needs: [pinned native compiler and sanitizer runtime, controlled callback fixture, cgroup memory observation]
      sources: [{title: Clang AddressSanitizer documentation, url: 'https://clang.llvm.org/docs/AddressSanitizer.html'}]

  - id: offline-draft-identity-merge
    batch: incident-workflows-v2
    title: Repair offline draft synchronization without losing concurrent product edits
    work: [bugfix, refactor, feature]
    architecture: coupled
    repair_scope: structural
    layers: [ui, local-storage, sdk, api, database, queue, delivery]
    interfaces: [browser-cli, http, typescript-sdk, sc]
    languages: [python, typescript, sql]
    domain: field service work orders
    mechanism: Optimistic drafts use temporary IDs inside related records; reconnect rewrites only top-level identity and applies whole-record replacement against a stale server revision.
    symptoms: Offline photos attach to the wrong draft and a reconnect silently removes notes written by another technician.
    investigation: [local outbox graph, temporary-to-server identity map, revision headers, conflict UI state, submitted snapshot hashes]
    limits: {agent_seconds: 14400, cpus: 2, memory_mb: 4096, logical_p99_ms: 900, soak_seconds: 180, error_budget: 0.001, request_count: 2000}
    schedule: [two_offline_devices, nested_temporary_ids, concurrent_field_edits, reconnect_reordered, lose_sync_reply, submit_during_conflict]
    requirements:
      - {id: identity-remap, outcome: All related draft records resolve to the correct server identity once; replay and reordered synchronization create no duplicate draft or orphan attachment., probe: Create nested offline records on two clients and compare durable relationship graphs after reconnect and retry.}
      - {id: conflict, outcome: Nonconflicting field edits are preserved; conflicting changes are surfaced for explicit resolution and never silently overwrite acknowledged edits., probe: Concurrent disjoint and conflicting edits from two browser sessions using documented revision semantics.}
      - {id: submit-snapshot, outcome: Submission uses the exact resolved snapshot the user confirmed; later synchronization cannot silently alter a submitted work order., probe: Pause outbox delivery around confirmation then release stale edits and inspect immutable submitted data.}
      - {id: accessible-state, outcome: Offline pending conflict failed and synced states are visible and keyboard operable; reload retains pending work and the conflict decision., probe: Real browser offline and reload journeys followed by SDK readback.}
    controls:
      - {id: remap-root-only, fails: identity-remap, shortcut: Replace only the top-level temporary ID.}
      - {id: last-write-wins, fails: conflict, shortcut: Replace the whole server record on reconnect.}
      - {id: mutable-submit-reference, fails: submit-snapshot, shortcut: Store a pointer to the draft instead of the confirmed submitted snapshot.}
      - {id: discard-local-on-error, fails: accessible-state, shortcut: Clear the local outbox after a synchronization error.}
    harness_failures: [using one browser session, ignoring nested relationships, mistaking optimistic display for durable completion]
    evolution: Synchronize an attachment added before conflict resolution after the work order has been submitted; it must follow the declared submission boundary.
