    domain: internal application platform
    mechanism: The planner repeatedly walks every downstream path and caches plans using package names only; a changed dependency edge or shared prerequisite leaves cached plans stale and can enqueue a dependent before all prerequisites succeed.
    symptoms: Larger workspaces spend minutes planning; a shared library deployment sometimes rolls out consumers before the needed artifact is available.
    investigation: [dependency graph revisions, edge fingerprints, planner profiles, execution journal, immutable prerequisite artifacts]
