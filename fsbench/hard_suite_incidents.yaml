    schedule: [pause_rewrite, concurrent_document_update, activate_new_key, restart_reader, replay_rewrite, retire_old_key]
    requirements:
      - {id: decryptability, outcome: Every retained authorized document decrypts to its current committed plaintext through rotation and restart; envelope metadata identifies its concrete key version., probe: Independently decrypt all retained object versions at each rotation barrier using operator fixture keys.}
      - {id: revision-preservation, outcome: A stale rewrite cannot overwrite a newer document revision or cross tenant ownership; replay changes no already completed revision., probe: Pause old rewrite before publication; commit a user update; resume and compare latest document bytes and revision.}
      - {id: retirement, outcome: Retire an old key only after the explicitly declared retained versions and restore manifests no longer depend on it; denied retirement leaves documents available., probe: Attempt retirement while one dependent retained version remains then complete migration and repeat.}
      - {id: secrecy, outcome: Plaintext keys and document bodies never appear in application logs CLI diagnostics or deployment artifacts; workload grants remain exactly scoped., probe: Operator leak scan against seeded fixture secrets and plaintext plus effective-grant audit.}
    controls:
      - {id: alias-without-version, fails: decryptability, shortcut: Store only the mutable key alias in envelope metadata.}
      - {id: blind-rewrite, fails: revision-preservation, shortcut: Publish re-encrypted bytes without checking the document revision.}
      - {id: retire-after-current-rows, fails: retirement, shortcut: Ignore retained object and restore versions when retiring the key.}
      - {id: log-decryption-context, fails: secrecy, shortcut: Print raw keys and plaintext to diagnose failures.}
    harness_failures: [missing historical versions, confusing key activation with safe retirement, leaking diagnostic material]
    evolution: Restore a still-retained object version after the active key rotates; its stated retention and decryption contract must remain valid.
    novelty: {boundary: ciphertext-envelope-revision-key-retirement, failure_mode: metadata-and-ciphertext-version-diverge, invariant: decryptability-and-newer-revisions-survive-rotation, closest_case: sdk-retry-isolation, distinction: This is encryption envelope revision and retirement dependency management rather than retry receipts and refreshed account identity.}
    realism:
      trigger: A customer requests scheduled encryption-key rotation while document edits and retained-version restores are active.
      baseline: Steady-state encryption works; overlapping rewrite and key retirement expose metadata and revision races.
