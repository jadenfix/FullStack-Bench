    performance: {distributions: [uniform, skewed], sizes: [2000, 8000, 32000], min_speedup: 3.0, max_growth_ratio: 6.0, max_peak_rss_mb: 256, repetitions: 5, workload: Whole-backlog dispatch simulation through the real scheduler with bounded declared job cost classes and at most 32 active tenants.}
    schedule: [bulk_tenant_arrival, small_tenant_arrival, bounded_long_job, retry_job, cancel_queued_job, worker_restart]
    requirements:
      - {id: service-guarantee, outcome: Each continuously backlogged eligible tenant receives a worker start within its declared 20-second bound under the bounded job-duration workload; tenant concurrency caps hold., probe: Operator-observed job start and completion times under precommitted arrival schedules.}
      - {id: accounting, outcome: Every accepted uncancelled job has one final result and cancelled queued jobs release admission weight; retry cannot multiply a tenant's reserved share., probe: Reconcile accepted job IDs retry ancestry cancellation records and actual worker starts.}
      - {id: planner-budget, outcome: Scheduling the complete backlog meets published growth and memory budgets while retaining the required fairness and eligibility semantics., probe: Time full declared workloads on both backlog distributions and compare permitted starts with an independent contract checker.}
      - {id: product, outcome: The page and API show truthful queued running failed and complete states and survive worker restart without losing accepted jobs., probe: Real browser job submission followed by cancellation reload and restart with SDK state readback.}
    controls:
      - {id: global-fifo-only, fails: service-guarantee, shortcut: Preserve a single FIFO across all tenants.}
      - {id: reserve-per-attempt, fails: accounting, shortcut: Count every retry as a newly entitled job.}
      - {id: rescan-whole-backlog, fails: planner-budget, shortcut: Add fairness but retain a full scan for every dispatch.}
      - {id: drop-bulk-jobs, fails: accounting, shortcut: Remove the large tenant's backlog to meet small-tenant latency.}
    harness_failures: [unrealizable fairness with unbounded job durations, optimizing only admission checks, losing accepted work during restart]
    evolution: A tenant changes its concurrency tier while old retries are queued; earlier accepted jobs keep the explicitly stated entitlement policy.
    novelty: {boundary: tenant-admission-worker-share, failure_mode: global-fifo-and-full-backlog-rescan, invariant: bounded-service-with-conserved-admission, closest_case: cache-index-extraction, distinction: This adds observable multi-tenant scheduling fairness and retry weight accounting rather than cache lookup indexing and instance ownership.}
    realism:
