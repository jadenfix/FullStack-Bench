    performance: {distributions: [uniform, skewed], sizes: [2000, 8000, 32000], min_speedup: 3.0, max_growth_ratio: 6.0, max_peak_rss_mb: 256, repetitions: 5, workload: Complete invalidation and execution-plan generation for sparse DAGs with at most four edges per node and bounded output; include diamond joins and high fanout.}
    schedule: [diamond_dependencies, change_edge_only, fail_prerequisite, retry_failed_job, insert_cycle, cold_restart]
    requirements:
      - {id: affected-set, outcome: Every and only component affected by the declared source or edge change is invalidated; cached plans reflect the complete graph revision., probe: Compare the affected component set with an independent graph reachability reference on fresh graph revisions.}
      - {id: precedence, outcome: Dependents start only after all prerequisites produce the required successful artifact; independent jobs may run in any valid order., probe: Barrier-controlled diamond graph execution with one prerequisite delayed or failed.}
      - {id: work-budget, outcome: Complete plan generation meets the published growth and memory budgets without enumerating path duplicates or dropping affected components., probe: Operator-timed whole-graph planning on both declared sparse graph distributions.}
      - {id: invalid-graph, outcome: Cycles and missing prerequisites are reported with an actionable bounded diagnostic before any production work is started; retry resumes only safely eligible jobs., probe: Add a cycle and a missing artifact then inspect actual execution and error output through CLI and SDK.}
    controls:
      - {id: package-names-only, fails: affected-set, shortcut: Reuse a cached plan when dependency edges change.}
      - {id: first-parent-ready, fails: precedence, shortcut: Schedule a child after only one prerequisite succeeds.}
      - {id: enumerate-every-path, fails: work-budget, shortcut: Keep recursively enumerating repeated downstream paths.}
      - {id: ignore-cycle, fails: invalid-graph, shortcut: Skip cycle nodes and deploy the rest silently.}
    harness_failures: [profiling only parsing, assuming one valid topological order, optimizing while dropping graph dependencies]
    evolution: Change an edge without changing any package name or source bytes; the next plan must reflect the new dependency.
    novelty: {boundary: dependency-graph-revision-execution-readiness, failure_mode: path-explosion-and-incomplete-predecessor-check, invariant: exact-affected-set-and-all-prerequisites, closest_case: build-provenance-cache, distinction: This fixes graph traversal and execution precedence rather than artifact cache fingerprints or regional promotion provenance.}
    realism:
      trigger: An internal platform moves from dozens to thousands of component definitions and introduces shared prerequisites.
      baseline: Tree-like graphs plan correctly; reconvergent DAGs and edge-only updates expose correctness and growth failures.
      impact: Product teams wait on slow plans or receive consumers that cannot start against the available prerequisite versions.
      scale: Three published node counts; sparse graph edge ceiling four times node count; affected-set output bounded by node count; two worker slots.
      change_window: Keep existing applications live; planning and invalid graph validation precede any change to their serving releases.
      mitigation: Retain the last validated serving plan and suspend only new plans whose prerequisite evidence is incomplete.
      protected: [existing serving releases, prerequisite artifact IDs, graph revision history, worker resource ceiling]
      capability_needs: [independent DAG fixtures, operator job-start observations, immutable prerequisite artifact fixture]
      sources: [{title: Python graphlib topological sorting contracts, url: 'https://docs.python.org/3.12/library/graphlib.html'}]

  - id: tenant-envelope-key-rotation
