    requirements:
      - {id: exact-file, outcome: Complete and resumed downloads produce the exact bytes of one committed object version; encoded offsets are never mixed with decoded offsets., probe: Independently hash CLI and SDK files downloaded through actual transforming cache fixtures.}
      - {id: changed-object, outcome: An object change during resume either restarts safely or reports a version conflict; bytes from two representations are never appended together., probe: Replace the object while a partial file is retained then resume with stale validators.}
      - {id: range-contract, outcome: Clients handle declared 200 206 and 416 responses according to the published HTTP contract without claiming partial data is a complete file., probe: Actual HTTP fixtures issue each response with correct range metadata and changed lengths.}
      - {id: credentials, outcome: Expired download access cannot be extended by cached range responses and customer credentials are not forwarded to unrelated redirect origins., probe: Expire the credential and redirect to a separate controlled origin while inspecting received headers.}
    controls:
      - {id: decoded-byte-offset, fails: exact-file, shortcut: Request encoded ranges using local decoded file length.}
      - {id: weak-etag-append, fails: changed-object, shortcut: Append after comparing weak validators only.}
      - {id: append-full-200, fails: range-contract, shortcut: Append a full 200 response to the existing partial file.}
      - {id: forward-all-redirect-headers, fails: credentials, shortcut: Preserve authorization headers across unrelated origins.}
    harness_failures: [testing origin instead of CDN, missing response headers, declaring success without byte-level verification]
    evolution: The origin switches compression behavior for the same object path between the interrupted transfer and resume.
    novelty: {boundary: encoded-representation-partial-file-validator, failure_mode: range-offset-and-version-mismatch, invariant: one-version-byte-exact-resume, closest_case: mcp-cli-stream-resume, distinction: This is HTTP representation range semantics and cache transformation rather than MCP framing or durable export job resume.}
    realism:
      trigger: A report CDN enables compression while a desktop SDK resumes downloads after unreliable connections.
      baseline: Uninterrupted transfers pass; interrupted transformed responses expose offset and validator errors.
      impact: Customers open a corrupt report after the CLI printed a successful download message.
