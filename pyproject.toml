[project]
name = "fullstack-bench"
version = "0.1.0"
description = "A full-stack, long-horizon agent benchmark built on SimCloud, a simulated provider-neutral cloud."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.9",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
]

[project.scripts]
sc = "simcloud.cli:main"
simcloud = "simcloud.server:main"
simcloud-mcp = "simcloud.mcp_server:main"
simsaas = "simsaas.server:main"

[dependency-groups]
dev = [
    "harbor==0.23.0",
    "mini-swe-agent>=2.4.6",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff==0.13.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simcloud", "simsaas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
