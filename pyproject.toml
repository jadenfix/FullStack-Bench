[project]
name = "fullstack-bench"
version = "0.1.0"
description = "A full-stack, long-horizon agent benchmark built on SimCloud, a simulated provider-neutral cloud."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
sc = "simcloud.cli:main"
simcloud = "simcloud.server:main"
simcloud-mcp = "simcloud.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simcloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
