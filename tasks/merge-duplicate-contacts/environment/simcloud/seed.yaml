  statements:
  - "CREATE TABLE contacts (\n    id            text PRIMARY KEY,\n    tenant_id     text NOT NULL,\n    email         text NOT NULL,\n    email_norm    text NOT NULL,\n    name          text NOT NULL DEFAULT\
    \ '',\n    status        text NOT NULL DEFAULT 'active',   -- active | merged\n    merged_into   text REFERENCES contacts (id),\n    created_at    timestamptz NOT NULL DEFAULT now(),\n    last_seen_at\
    \  timestamptz\n);\nCREATE INDEX contacts_tenant ON contacts (tenant_id, email_norm);\nCREATE TABLE activities (\n    id          bigserial PRIMARY KEY,\n    contact_id  text NOT NULL REFERENCES contacts\
    \ (id),\n    kind        text NOT NULL,\n    note        text,\n    at          timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX activities_contact ON activities (contact_id);\nCREATE TABLE deals\
    \ (\n    id            text PRIMARY KEY,\n    contact_id    text NOT NULL REFERENCES contacts (id),\n    amount_cents  integer NOT NULL,\n    stage         text NOT NULL\n);\nCREATE INDEX deals_contact\
    \ ON deals (contact_id);\n"
