deployments:
- project: crm
  env: staging
  service: contacts
  source: /seed/contacts-current
- project: crm
  env: prod
  service: contacts
  source: /seed/contacts-current
job_deployments:
- project: crm
  env: staging
  job: contacts-import
  source: /seed/contacts-current
- project: crm
  env: prod
  job: contacts-import
  source: /seed/contacts-current
guard:
  protected_envs:
  - prod
  checks:
  - name: contact-read
    service: crm/prod/contacts
    path: /contacts/c-0310
    expect_status:
    - 200
    body_contains: c-0310
    timeout_ms: 1500
    every_seconds: 2
    failure_threshold: 3
    severity: SEV1
  - name: contact-write
    service: crm/prod/contacts
    method: POST
    path: /contacts/c-0310/touch
    expect_status:
    - 200
    timeout_ms: 1500
    every_seconds: 2
    failure_threshold: 3
    severity: SEV1
principals:
- name: user:oncall
  project: crm
  token_file: /shared/oncall.token
