# The production cluster as it actually is (applied as the operator at world start).
apiVersion: v1
kind: Namespace
metadata: {name: bookings, labels: {team: pulse}}
---
apiVersion: v1
kind: Namespace
metadata: {name: payments, labels: {team: payouts}}
---
apiVersion: v1
kind: Namespace
metadata: {name: platform, labels: {team: platform}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: ledger, namespace: bookings, labels: {app: ledger}}
spec:
  serviceName: ledger-hl
  replicas: 1
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions: [{key: topology.kubernetes.io/zone, operator: In, values: [zone-2]}]
      containers:
        - name: ledgerd
          image: "{{image:ledger:1.4.2}}"
          env:
            - {name: LEDGER_BOOTSTRAP, value: /opt/ledger/history.jsonl}
          ports: [{containerPort: 7000, name: http}]
          readinessProbe: {httpGet: {path: /healthz, port: 7000}, periodSeconds: 2}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: ledger-hl, namespace: bookings}
spec:
  clusterIP: None
  selector: {app: ledger}
  ports: [{port: 7000, name: http}]
---
apiVersion: v1
kind: Service
metadata: {name: ledger, namespace: bookings}
spec:
  selector: {app: ledger}
  ports: [{port: 7000, targetPort: 7000, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bookings
  labels: {app: api}
  annotations: {pulse.dev/note: "pinned to zone-2 next to the ledger during the July latency incident (dana)"}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{key: topology.kubernetes.io/zone, operator: In, values: [zone-2]}]
      containers:
        - name: api
          image: "{{image:api:2026.09.3}}"
          env:
            - {name: LEDGER_URL, value: "http://ledger:7000"}
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: bookings}
spec:
  type: LoadBalancer
  selector: {app: api}
  ports: [{port: 9080, targetPort: 8080, name: http}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: log-shipper, namespace: platform}
spec:
  selector: {matchLabels: {app: log-shipper}}
  template:
    metadata: {labels: {app: log-shipper}}
    spec:
      containers:
        - name: shipper
          image: "{{image:shipper:0.9}}"
          volumeMounts: [{name: buf, mountPath: /buffer}]
      volumes: [{name: buf, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payouts, namespace: payments, labels: {app: payouts}}
spec:
  replicas: 3
  selector: {matchLabels: {app: payouts}}
  template:
    metadata: {labels: {app: payouts}}
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway,
           labelSelector: {matchLabels: {app: payouts}}}
      containers:
        - name: payouts
          image: "{{image:payouts:3.1}}"
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 2}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: payouts, namespace: payments}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: payouts}}
