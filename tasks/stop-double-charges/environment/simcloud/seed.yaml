- project: shop
  env: staging
  database: orders
  statements:
  - "CREATE TABLE orders (\n    id            text PRIMARY KEY,\n    cart_id       text NOT NULL,\n    customer_id   text NOT NULL,\n    amount_cents  integer NOT NULL CHECK (amount_cents > 0),\n    currency\
    \      text NOT NULL DEFAULT 'usd',\n    status        text NOT NULL,\n    charge_id     text,\n    request_id    text,\n    created_at    timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX orders_customer\
    \ ON orders (customer_id);\n"
  - "-- support refunds go through the payments dashboard; refunded_cents is filled by the nightly sync job\nALTER TABLE orders ADD COLUMN refunded_cents integer NOT NULL DEFAULT 0;\nCREATE TABLE order_events\
    \ (\n    id        bigserial PRIMARY KEY,\n    order_id  text NOT NULL,\n    kind      text NOT NULL,\n    detail    text,\n    at        timestamptz NOT NULL DEFAULT now()\n);\n"
