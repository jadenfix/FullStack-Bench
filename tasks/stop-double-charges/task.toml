schema_version = "1.1"

[task]
name = "fullstack-bench/stop-double-charges"
description = "Stop double charges at the source, refund each duplicate exactly once and mark the records, without an outage or destructive production SQL."
keywords = ["payments", "idempotency", "postgres", "refunds", "data-repair", "deploy"]

[metadata]
difficulty = "hard"
category = "incident-and-data-repair"
tags = ["simcloud", "tillpoint", "postgres", "idempotency", "refunds"]
expert_time_estimate_min = 90.0
layers = ["api", "payments", "database", "delivery", "data-repair"]
interfaces = ["sc", "api", "psql"]
skills = ["simcloud", "tillpoint"]
causal_path = ["ordersvc/payclient.py", "ordersvc/app.py", "ordersvc/db.py", "ordersvc/settings.py"]
hidden_literals = ["TILLPOINT_API_KEY", "TILLPOINT_URL"]

[metadata.lineage]
family = "financial reconciliation / durable state"
template = "repair duplicated money movement and make the write path retry-safe without losing finance records"
starting_code = "orders service with a non-idempotent checkout and a payments provider"
causal_defect = "a client retry re-runs checkout and charges the same cart again"
reference_strategy = "durable idempotency on the cart, refunds reconciled against the provider's books, order rows marked not deleted"
mechanism = "new causal mechanism"
variants = []
descendants_stay_with = "development"

[metadata.workload]
model = "observer only"
source = "guard synthetic check on GET /orders/<id> every 2 s; one operator retried checkout after handoff"
identity = "one request per check; the post-handoff checkout keeps one cart_id across its two requests"
accounting = "scheduled vs observed in harm.observation.checks; challenges.json for the retried checkout"
limitation = "no independent customer load generator yet: the observer is the only traffic during the agent phase"

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
timeout_sec = 600.0

[[verifier.collect]]
command = "python /seed/collect.py"
service = "simcloud"
timeout_sec = 240.0

[[artifacts]]
source = "/evidence"
service = "simcloud"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
skills_dir = "/skills"

[[environment.mcp_servers]]
name = "simcloud"
transport = "stdio"
command = "simcloud-mcp"
