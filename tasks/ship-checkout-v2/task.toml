schema_version = "1.1"

[task]
name = "fullstack-bench/ship-checkout-v2"
description = "Ship the staging-verified checkout v2 to production without an outage, with least privilege, on SimCloud."
keywords = ["ship-to-prod", "promotion", "iam", "secrets", "feature-flags", "docs-drift"]

[metadata]
difficulty = "hard"
category = "ship-to-prod"
tags = ["simcloud", "promotion", "least-privilege", "kv", "secrets", "propagation"]
expert_time_estimate_min = 60.0
layers = ["api", "config", "identity", "secrets", "kv", "delivery"]
interfaces = ["sc", "api-or-mcp"]
skills = ["simcloud"]
drifts = ["iam-immediate", "canary-default-weight"]
causal_path = ["shopsrv.py", "common/util.py", "conf/app.json"]
hidden_literals = ["PAYMENTS_SIGNING_KEY", "checkout.engine", "checkout/quote"]

[metadata.lineage]
family = "causal incident repair / safe promotion"
template = "promote a staging-verified release to production under live traffic with least privilege"
starting_code = "shopsrv checkout service, v1 serving prod, v2 serving staging"
causal_defect = "production lacks the runtime grants, flag and rollout allowance the new release needs; IAM changes propagate with a delay"
reference_strategy = "scoped policy added beside the existing one, flag set, spec amended, wait for propagation, promote the exact staging artifact"
mechanism = "new causal mechanism"
variants = ["partial public check (designated case)"]
descendants_stay_with = "development"
reference_needs_destructive = false

[metadata.workload]
model = "observer only"
source = "guard synthetic check on GET /checkout/quote?cart=demo every 2 s"
identity = "one request per check; no retries; latency from request start"
accounting = "scheduled vs observed in harm.observation.checks"
limitation = "no independent customer load generator yet: the observer is the only traffic, so sustained-arrival claims are not supported for this task"

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
timeout_sec = 600.0

[[verifier.collect]]
command = "/seed/collect.sh"
service = "simcloud"
timeout_sec = 180.0

[[artifacts]]
source = "/evidence"
service = "simcloud"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
skills_dir = "/skills"

[[environment.mcp_servers]]
name = "simcloud"
transport = "stdio"
command = "simcloud-mcp"
