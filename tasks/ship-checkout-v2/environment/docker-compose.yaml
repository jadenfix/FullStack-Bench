services:
  main:
    depends_on:
      simcloud:
        condition: service_healthy
    volumes:
      - shared:/shared
  simcloud:
    build:
      context: .
      dockerfile: simcloud/Dockerfile
    environment:
      SIMCLOUD_ADMIN_TOKEN: op-7c1e5a93d24b48f0b6e2
      SIMCLOUD_PUBLIC_ROUTER_URL: http://simcloud:7480
    volumes:
      - shared:/shared
volumes:
  shared: {}
